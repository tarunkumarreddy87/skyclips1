AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFront distribution in front of HANUMAN artifacts S3 bucket (editor
  proxies / posters / sprites / TTS). Pair with API MEDIA_CDN_BASE_URL and
  web NEXT_PUBLIC_MEDIA_CDN_BASE_URL (no trailing slash).

Parameters:
  ArtifactsBucketName:
    Type: String
    Default: hanuman-artifacts-623271127861
  EnvironmentName:
    Type: String
    Default: hanuman-prod

Resources:
  MediaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${EnvironmentName}-media-oac"
        Description: OAC for HANUMAN media CDN
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${EnvironmentName} media CDN (proxies/posters/TTS)"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: ""
        Origins:
          - Id: ArtifactsS3
            DomainName: !Sub "${ArtifactsBucketName}.s3.us-east-1.amazonaws.com"
            OriginAccessControlId: !GetAtt MediaOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: ArtifactsS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # CORS-with-preflight
        # Path-style object keys: projects/...

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ArtifactsBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}"

Outputs:
  MediaCdnDomainName:
    Description: Set MEDIA_CDN_BASE_URL / NEXT_PUBLIC_MEDIA_CDN_BASE_URL to https://{this}
    Value: !GetAtt MediaDistribution.DomainName
  MediaCdnBaseUrl:
    Value: !Sub "https://${MediaDistribution.DomainName}"
  DistributionId:
    Value: !Ref MediaDistribution
