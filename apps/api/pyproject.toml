[project]
name = "hanuman-api"
version = "0.1.0"
description = "HANUMAN FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "hanuman-shared-types",
    "hanuman-timeline-schema",
    "boto3>=1.35.0",
    "temporalio>=1.8.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
hanuman-shared-types = { path = "../../packages/shared-types/python", editable = true }
hanuman-timeline-schema = { path = "../../packages/timeline-schema/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests requiring PostgreSQL",
]
