[project]
name = "hanuman-media"
version = "0.1.0"
description = "HANUMAN FFmpeg media render worker"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.8.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "jsonschema>=4.23.0",
    "hanuman-shared-types",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.uv.sources]
hanuman-shared-types = { path = "../../packages/shared-types/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
