[project]
name = "hanuman-orchestrator"
version = "0.1.0"
description = "HANUMAN Temporal orchestrator worker"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.8.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "hanuman-shared-types",
]

[tool.uv.sources]
hanuman-shared-types = { path = "../../packages/shared-types/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
