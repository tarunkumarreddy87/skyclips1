name: Feature request
description: Propose a concrete improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed approach
      description: Include affected services, packages, contracts and alternatives.
  - type: textarea
    id: tests
    attributes:
      label: Acceptance criteria and test plan
    validations:
      required: true
